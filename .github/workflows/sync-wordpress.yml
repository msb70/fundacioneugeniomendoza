name: Sincronizar blog desde WordPress

# El equipo publica en el WordPress temporal; este workflow trae al sitio Astro las entradas,
# listados, categorías, etiquetas, home y medios nuevos o cambiados, y publica.
# Detalles y salvaguardas: tools/sync/sync_wp.py.
#
# Si el WordPress está protegido con contraseña (hPanel → Protección de directorios), crear los
# secretos WP_USER y WP_PASS en Settings → Secrets and variables → Actions.

on:
  schedule:
    - cron: '17 * * * *'   # cada hora (UTC); GitHub puede retrasarlo unos minutos
  workflow_dispatch:       # "Run workflow" para sincronizar al momento
    inputs:
      intento:
        description: 'Número de intento (lo rellena el propio workflow al relanzarse)'
        required: false
        default: '1'
  workflow_call:           # lo llama publicar-wordpress.yml tras crear/actualizar entradas
    inputs:
      intento:
        type: string
        required: false
        default: '1'
    outputs:
      changed:
        description: true si la sincronización commiteó cambios (y ya llamó a deploy.yml)
        value: ${{ jobs.sync.outputs.changed }}

permissions:
  contents: write
  actions: write   # para relanzarse en otro runner si este no alcanza el WP

concurrency:
  group: sync-wordpress
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      # Algunos runners de GitHub no tienen ruta de red hasta Hostinger (Errno 101, 22-10 y 27-10-2026) y
      # el fallo dura toda la vida del runner. Se comprueba en 30 s y, si no hay acceso, el workflow se
      # relanza a sí mismo (runner nuevo) hasta 3 veces en lugar de reintentar 14 minutos aquí.
      - name: Comprobar acceso al WordPress
        id: acceso
        env:
          WP_URL: ${{ vars.WP_URL || 'https://fundacioneugeniomendoza-com-726353.hostingersite.com' }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASS: ${{ secrets.WP_PASS }}
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 \
                   ${WP_USER:+-u "$WP_USER:$WP_PASS"} -A 'FEM-sync/1.0' "$WP_URL/wp-json/wp/v2/posts?per_page=1&_fields=id" || true)
            case "$code" in 200|401) echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0;; esac
            echo "intento $i: respuesta '$code'"; sleep 5
          done
          echo "ok=false" >> "$GITHUB_OUTPUT"

      - name: Relanzar en otro runner
        if: steps.acceso.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          INTENTO: ${{ inputs.intento || '1' }}
        run: |
          if [ "$INTENTO" -ge 3 ]; then
            echo "::error::Sin acceso al WordPress tras $INTENTO intentos en runners distintos"; exit 1
          fi
          siguiente=$((INTENTO + 1))
          gh workflow run sync-wordpress.yml --ref main -f intento=$siguiente
          echo "::warning::Este runner no alcanza el WordPress; relanzado como intento $siguiente (sync-wordpress.yml)"
          exit 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Sincronizar con WordPress
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASS: ${{ secrets.WP_PASS }}
          WP_URL: ${{ vars.WP_URL }}
        run: python3 tools/sync/sync_wp.py

      - name: Iconos usados (Font Awesome reducido)
        run: |
          pip install fonttools brotli
          python3 tools/fa_subset.py

      - name: Compilar (comprobación antes de publicar)
        env:
          PUBLIC_SITE_ENV: production
        run: |
          npm run build
          test -f dist/index.html
          test "$(find dist -name index.html | wc -l)" -gt 100

      - name: Commit
        id: commit
        run: |
          git add -A src public
          if git diff --cached --quiet; then
            echo "Sin cambios en WordPress"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Sync WordPress: $(git diff --cached --name-only -- src/site/pages | grep -c '\.html$') páginas" \
            -m "Sincronización automática desde el WordPress temporal (tools/sync/sync_wp.py)."
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: main
