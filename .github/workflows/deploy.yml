name: Build y publicar en rama deploy

# main = código fuente. deploy = solo el sitio compilado (lo que Hostinger publica).
# Hostinger (hPanel → Git) está conectado a la rama `deploy` con auto-deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Build diario a las 00:07 de Caracas (04:07 UTC): saca del HTML las diapositivas de eventos
  # que ya terminaron (en el navegador ya se ocultan solas al acabar el día).
  schedule:
    - cron: '7 4 * * *'
  # La sincronización con WordPress (sync-wordpress.yml) llama a este workflow tras su commit:
  # los push hechos con GITHUB_TOKEN no disparan otros workflows por sí solos.
  workflow_call:
    inputs:
      ref:
        description: Rama o commit a compilar
        type: string
        default: main

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # deploy         → producción (SITE_ENV de Actions, normalmente production)
        # deploy-staging → pruebas: siempre staging (noindex). Conectar en hPanel → Git
        #                  a un sitio de pruebas para revisar antes de publicar.
        include:
          - branch: deploy
            env: production
          - branch: deploy-staging
            env: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # SITE_ENV se define en Settings → Secrets and variables → Actions → Variables.
      # staging (por defecto): noindex + robots.txt bloqueando todo.
      # production: al sustituir el WordPress en fundacioneugeniomendoza.com.
      - name: Build
        env:
          PUBLIC_SITE_ENV: ${{ matrix.branch == 'deploy' && (vars.SITE_ENV || 'staging') || 'staging' }}
        run: npm run build

      - name: Comprobar build
        run: |
          test -f dist/index.html
          test -f dist/.htaccess
          test -f dist/api/contact.php
          test -f dist/feed.xml
          test -f dist/assets/fem-fixes.css
          test -f dist/assets/fa/fa.css
          test -f dist/assets/fonts/fonts.css
          if grep -rl --exclude-dir=blog-home "fonts.googleapis.com/css2?family=Segoe" dist --include=index.html | head -1 | grep -q .; then echo "Fuente rota de vuelta"; exit 1; fi
          echo "Páginas: $(find dist -name index.html | wc -l)"

      # QA automática (auditoría del 19-10-2026): excepciones JS y recursos propios rotos bloquean la publicación.
      - name: QA del sitio compilado
        if: matrix.branch == 'deploy'
        run: |
          npx playwright install --with-deps chromium
          node tools/qa/smoke.mjs

      - name: Publicar dist/ en la rama ${{ matrix.branch }}
        run: |
          cd dist
          git init -q -b ${{ matrix.branch }}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} (${{ matrix.env }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ${{ matrix.branch }}
