<script>
document.addEventListener('DOMContentLoaded', function() {
  const marquee = document.querySelector('.fem-logo-marquee');
  if (!marquee) return;

  const logos = marquee.querySelectorAll('.fem-logo');
  const marqueeCenter = marquee.offsetWidth / 2;

  function updateLogos() {
    logos.forEach(logo => {
      const rect = logo.getBoundingClientRect();
      const marqueeRect = marquee.getBoundingClientRect();
      const logoCenter = rect.left + rect.width / 2 - marqueeRect.left;
      const distanceFromCenter = Math.abs(logoCenter - marqueeCenter);
      
      const img = logo.querySelector('img');
      if (distanceFromCenter < 100) { // Área del centro (ajusta este valor)
        img.style.opacity = '1';
        img.style.transform = 'scale(1.05)';
      } else {
        img.style.opacity = '0.7';
        img.style.transform = 'scale(1)';
      }
    });
    
    requestAnimationFrame(updateLogos);
  }
  
  updateLogos();
});

// Efecto de zoom al cargar la página
document.addEventListener('DOMContentLoaded', function() {
  const heroBg = document.querySelector('.hero .hero-background');
  if (heroBg) {
    setTimeout(function() {
      heroBg.classList.add('loaded');
    }, 100);
  }
});

// Efecto Parallax en el Hero
window.addEventListener('scroll', function() {
  const hero = document.querySelector('.hero');
  if (hero) {
    const scrolled = window.pageYOffset;
    const heroHeight = hero.offsetHeight;
    
    // Solo aplicar parallax si estamos dentro del hero
    if (scrolled <= heroHeight) {
      const heroBg = hero.querySelector('.hero-background');
      heroBg.style.transform = 'translateY(' + (scrolled * 0.5) + 'px) scale(1.05)';
    }
  }
});

// Carrusel
document.addEventListener('DOMContentLoaded', function () {
  const carousel = document.querySelector('.fem-hero-carousel');

  if (!carousel) return;

  const slides = carousel.querySelectorAll('.fem-hero-slide');
  const dots = carousel.querySelectorAll('.fem-hero-dots button');
  const prev = carousel.querySelector('.fem-hero-prev');
  const next = carousel.querySelector('.fem-hero-next');

  let current = 0;
  let timer;

  function showSlide(index) {
    slides[current].classList.remove('active');
    dots[current].classList.remove('active');

    current = (index + slides.length) % slides.length;

    slides[current].classList.add('active');
    dots[current].classList.add('active');
  }

  function nextSlide() {
    showSlide(current + 1);
  }

  function prevSlide() {
    showSlide(current - 1);
  }

  function startAutoplay() {
    timer = setInterval(nextSlide, 6000);
  }

  function resetAutoplay() {
    clearInterval(timer);
    startAutoplay();
  }

  next.addEventListener('click', function () {
    nextSlide();
    resetAutoplay();
  });

  prev.addEventListener('click', function () {
    prevSlide();
    resetAutoplay();
  });

  dots.forEach(function (dot, index) {
    dot.addEventListener('click', function () {
      showSlide(index);
      resetAutoplay();
    });
  });

  startAutoplay();
});
</script>
